packages:
  - packages/*
  - apps/*
  - skill

# 统一依赖版本。playwright 与 @playwright/test 精确锁定 1.58.2：
# 它对应 Chromium 构建号 1208（本机 ~/Library/Caches/ms-playwright/chromium-1208 已缓存），
# 升级 Playwright 会改变所需的浏览器构建号，需要重新 `pnpm exec playwright install chromium`。
catalog:
  "@hono/node-server": ^2.1.6
  "@playwright/test": 1.58.2
  "@types/node": ^22.20.5
  acorn: ^8.19.0
  happy-dom: ^21.0.4
  hono: ^4.13.16
  playwright: 1.58.2
  tsx: ^4.23.15
  typescript: ~5.9.3
  vitest: ~4.1.12
  zod: ^4.6.7
  # @nowme/validator（T1.1）：HTML / CSS / JS 解析（acorn 与 kit 共用，见上）
  parse5: ^8.1.0
  postcss: ^8.5.32
  postcss-safe-parser: ^7.1.0
  postcss-value-parser: ^4.2.0
  # @nowme/render（T1.3）：字体子集化（harfbuzz wasm）与 WOFF2 转换（wasm）、封面 PNG 量化压缩（纯 JS）
  subset-font: ^2.9.0
  fontverter: ^2.0.0
  upng-js: ^2.1.0
  "@types/upng-js": ^2.1.5
  # @nowme/web（T3.1）：邀请二维码（服务端生成 SVG）
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.6

# pnpm 11+ 默认拒绝依赖的构建脚本且安装失败（strictDepBuilds）。这里显式批准：
# esbuild（tsx 依赖）的 postinstall 只校验 / 链接本平台的预编译二进制。
allowBuilds:
  esbuild: true
