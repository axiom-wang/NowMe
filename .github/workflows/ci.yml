name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # 正式发布一旦开始不能被下次推送中断。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright Chromium
        run: pnpm --filter @nowme/render exec playwright install --with-deps chromium
      - name: Kit fonts
        run: pnpm --filter @nowme/kit fonts:fetch
      - name: Skill package
        run: pnpm --filter @nowme/skill pack:skill
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright Chromium
        run: pnpm --filter @nowme/render exec playwright install --with-deps chromium
      - name: Kit fonts
        run: pnpm --filter @nowme/kit fonts:fetch
      - name: Skill package
        run: pnpm --filter @nowme/skill pack:skill
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  deploy:
    name: deploy demo and production
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: tencent-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure deployment connection
        env:
          DEPLOY_KEY: ${{ secrets.TENCENT_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/nowme_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/nowme_ci ~/.ssh/known_hosts
      - name: Send tested commit and deploy
        env:
          DEPLOY_HOST: ${{ vars.TENCENT_DEPLOY_HOST || 'ubuntu@124.222.53.43' }}
        run: |
          set -o pipefail
          git archive --format=tar.gz "$GITHUB_SHA" | ssh \
            -i ~/.ssh/nowme_ci -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=30 -o IPQoS=none \
            "$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Record deployment
        run: |
          printf '已部署提交 %s\n\n- [正式环境](https://124.222.53.43)\n- [Demo](https://124.222.53.43:8444)\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove connection key
        if: always()
        run: rm -f ~/.ssh/nowme_ci
